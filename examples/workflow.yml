# Copy to .github/workflows/no-ai-marks.yml in your repository.
name: no-ai-marks

on:
  pull_request:
    # "edited" re-runs the check when the title or description changes.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  no-ai-marks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: mishan/no-ai-marks@v0
