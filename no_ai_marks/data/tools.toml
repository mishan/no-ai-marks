# The AI tools no-ai-marks looks for.
#
# Almost all upkeep happens in this file: when a new model, agent, or bot
# account appears, add or extend an entry. Every rule's patterns are built
# from it. Projects can add entries in their own config file with the same
# fields, and `no-ai-marks tools` shows the combined list.
#
# Fields (only id is required):
#
#   id               Unique key. A project config entry with the same id
#                    extends this one; disable-tools = [...] switches it off.
#   kind             "product" (the default); "vendor" for a company name,
#                    which isn't matched in short tags like "(via X)" because
#                    projects that call its API write that; or "generic" for
#                    words like "an AI", matched only in attribution phrases.
#   names            Names as written. Case is ignored, and words may be
#                    separated by spaces or a hyphen ("Claude Code" also
#                    matches "claude-code").
#   patterns         Regular expressions for names a list can't spell out,
#                    such as numbered versions.
#   models           Model family words that can follow a name ("Opus" in
#                    "Claude Opus 4.5").
#   first-name       The name is also a person's first name. It then doesn't
#                    match when a capitalized word follows ("Claude Shannon"),
#                    unless that word is one of the models.
#   emails           Commit author and trailer emails. "*" stands for any
#                    local part.
#   github-logins    GitHub accounts. Matched as author names and as
#                    <id>+<login>@users.noreply.github.com emails.
#   author-patterns  Regular expressions matched against the whole author
#                    name, for tools that rename the author ("Jane (aider)").
#   branch-prefixes  Branch prefixes the tool creates ("claude" for claude/fix).
#   branch-patterns  Regular expressions for branch names that have no
#                    prefix, matched from the start ("Q-DEV-issue-\d+-").
#   session-urls     Links to shared chats or agent sessions, without
#                    https://. Subdomains such as www. also match. An id must
#                    follow, so a bare "chatgpt.com/share/" doesn't count.
#   markers          Exact text the tool puts in commit messages or pull
#                    request descriptions, such as HTML comments. Case is
#                    ignored.
#   metadata-keys    PNG text chunk keys the tool writes into images.
#   skip             Contexts to leave out: "phrases", "tags" (short
#                    mentions: "(via X)" and trailer keys like "X-Session"),
#                    "identity", or "metadata". Use it for names that are
#                    ordinary words.
#   examples         Text that must be flagged.
#   counterexamples  Text that must not be flagged.
#   source           Where the details came from: the tool's source code,
#                    docs, or public commits and pull requests. "unverified"
#                    marks details that still need one.
#
# The tests check every example, counterexample, email, login, branch
# prefix, session URL, marker, and metadata key below, so a new entry is
# covered without writing test code. tests/corpus/ holds the real commits,
# pull requests, and links these entries were checked against.

[[tool]]
id = "aider"
names = ["aider"]
emails = ["*@aider.chat"]
author-patterns = ['.*\(aider\)']
examples = [
  "Co-authored-by: aider (anthropic/claude-sonnet-4) <aider@aider.chat>",
  "Co-authored-by: Jane Dev (aider) <jane@example.com>",
]
source = "https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/repo.py#L246-L294"

