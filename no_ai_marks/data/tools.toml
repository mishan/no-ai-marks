# Words rather than products. Matched only in attribution phrases, and
# written so that policy text ("code generated by AI tools is not
# accepted") doesn't match.

[[tool]]
id = "generic"
kind = "generic"
patterns = [
  '(?:an?\s+)?(?:ai|llm|language\s+model)(?:\s+(?:model|assistant|agent|tool|system))?',
  'llms',
  'genai',
  '(?:a\s+)?large\s+language\s+model',
  'artificial\s+intelligence',
]
examples = [
  "Written with the help of an AI assistant",
  "# Code generated by AI. DO NOT EDIT.",
]
counterexamples = [
  "Code generated by AI tools is not accepted.",
  "Do not submit code generated by AI.",
  "Add AI-generated alt text feature",
]
